<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F8FAFC">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<title>ICSK Academics Helper</title>
<style>
/* =========================================================
   ICSK Academics Helper — styles
   Colours live in the :root variables. Change them there.
   ========================================================= */
:root{
  --bg:#0a0f24; --bg2:#0e1530; --card:#131b38; --card2:#1a2447; --line:#E2E8F0;
  --text:#e9edff; --muted:#a3aed6; --faint:#64748B;
  --blue:#5b8cff; --purple:#8f6bff; --teal:#3fd6c2; --green:#46dc9b; --amber:#ffc15a; --coral:#ff8a9a;
  --grad:linear-gradient(135deg,#5b8cff,#8f6bff);
  --shadow:0 10px 30px rgba(3,6,20,.35);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--text); min-height:100vh;
  font:16px/1.5 "Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",sans-serif;
  background:var(--bg);
  background-image:radial-gradient(900px 480px at 88% -8%,rgba(143,107,255,.18),transparent 60%),
                   radial-gradient(800px 480px at -10% 0%,rgba(91,140,255,.15),transparent 60%);
  background-attachment:fixed;
}
h1,h2,h3,h4,p{margin:0}
h1{font-size:1.5rem;letter-spacing:-.02em;line-height:1.2}
h2{font-size:1.15rem;letter-spacing:-.01em;line-height:1.3}
h3{font-size:1rem;line-height:1.3}
a{color:#9db9ff}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #9db9ff;outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:.86rem} .tiny{font-size:.76rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between} .end{justify-content:flex-end}
.stack>*+*{margin-top:12px} .stack-lg>*+*{margin-top:18px}
.grid{display:grid;gap:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ----- layout ----- */
.shell{display:grid;grid-template-columns:1fr;min-height:100vh}
.side{display:none}
.main{width:100%;max-width:1120px;margin:0 auto;padding:16px 16px 104px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.topbar .actions{display:flex;gap:8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
.logo{width:36px;height:36px;border-radius:11px;background:var(--grad);display:grid;place-items:center;font-size:.8rem;font-weight:800;color:var(--text);box-shadow:0 6px 18px rgba(91,140,255,.35)}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(6,1fr);
  background:rgba(12,18,42,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.bottomnav a,.side nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;min-height:50px;justify-content:center;
  color:var(--faint);font-size:.7rem;text-decoration:none;border-radius:12px}
.bottomnav a[aria-current=page]{color:var(--text);background:rgba(91,140,255,.14)}
.bottomnav a[aria-current=page] svg{color:var(--blue)}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
@media(min-width:900px){
  .shell{grid-template-columns:250px 1fr}
  .side{display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;padding:24px 16px;border-right:1px solid var(--line);background:rgba(10,15,36,.55)}
  .side nav{display:grid;gap:4px}
  .side nav a{flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 12px;font-size:.96rem;min-height:44px}
  .side nav a:hover{background:rgba(255,255,255,.04);color:var(--text)}
  .side nav a[aria-current=page]{background:rgba(91,140,255,.16);color:var(--text)}
  .side nav a[aria-current=page] svg{color:var(--blue)}
  .bottomnav{display:none}
  .main{padding:28px 32px 56px}
  h1{font-size:1.8rem}
}

/* ----- cards & basics ----- */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:var(--bg2)}
.card h2{margin-bottom:10px}
.cols-2{grid-template-columns:1fr}
.cols-3{grid-template-columns:1fr}
@media(min-width:760px){.cols-2{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1000px){.cols-3{grid-template-columns:repeat(3,1fr)}.cols-23{grid-template-columns:3fr 2fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:13px;border:1px solid transparent;
  background:var(--grad);color:var(--text);font-weight:600;cursor:pointer;text-decoration:none;transition:transform .15s,filter .15s,background .15s}
.btn:hover{filter:brightness(1.1)} .btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--text)}
.btn.ghost:hover{background:rgba(255,255,255,.05)}
.btn.small{min-height:38px;padding:6px 12px;font-size:.9rem;border-radius:11px}
.btn.danger{background:#c9485b}
.iconbtn{width:44px;height:44px;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.03);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.iconbtn[aria-pressed=true]{color:var(--amber);border-color:var(--amber);background:rgba(255,193,90,.12)}
.iconbtn:hover{color:var(--text);background:rgba(255,255,255,.07)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:rgba(91,140,255,.14);color:#c5d4ff;font-size:.82rem;font-weight:600}
.pill.good{background:rgba(70,220,155,.14);color:#8ef0c3}
.pill.warn{background:rgba(255,193,90,.15);color:#ffd68a}
.pill.bad{background:rgba(255,138,154,.15);color:#ffb0bb}
.pill.plain{background:rgba(255,255,255,.07);color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,#5b8cff);flex:none}
.notice{border:1px solid rgba(255,193,90,.35);background:rgba(255,193,90,.08);border-radius:16px;padding:12px 14px;font-size:.92rem}
.notice.info{border-color:rgba(91,140,255,.4);background:rgba(91,140,255,.09)}
.empty{text-align:center;padding:26px 14px;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.empty b{display:block;color:var(--text);margin-bottom:4px}
.bar{position:relative;height:10px;border-radius:99px;background:#222c57;overflow:visible}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--blue));min-width:2px;transition:width .4s}
.bar b{position:absolute;top:-4px;width:3px;height:18px;border-radius:2px;background:#fff;opacity:.9;transform:translateX(-1px)}
.bar.thin{height:7px}
.kpi{font-size:1.9rem;font-weight:750;letter-spacing:-.02em;line-height:1.1}

/* ----- the Daily Three ----- */
.three{display:grid;gap:14px}
@media(min-width:1000px){.three{grid-template-columns:repeat(3,1fr)}}
.q{position:relative;border-radius:22px;padding:20px 18px 18px 22px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.q::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--rail)}
.q h2{font-size:1.32rem;letter-spacing:-.02em;margin-bottom:12px}
.q .lead{font-weight:650;margin-bottom:4px}
.q-1{--rail:linear-gradient(#ff8a9a,#ffc15a)} .q-2{--rail:linear-gradient(#5b8cff,#8f6bff)} .q-3{--rail:linear-gradient(#3fd6c2,#46dc9b)}
.insight+.insight{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.insight .t{font-weight:650}
.insight.focus .t{color:#ffb0bb} .insight.watch .t{color:#ffd68a} .insight.good .t{color:#8ef0c3} .insight.info .t{color:#c5d4ff}
.insight .next{margin-top:6px;font-size:.9rem;padding:8px 10px;border-radius:11px;background:rgba(255,255,255,.05);color:var(--muted)}
.insight .next b{color:var(--text)}
.ring{width:150px;height:150px;flex:none}
.spark{width:100%;height:42px}

/* ----- lists: sessions, tasks ----- */
.item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:15px;background:var(--bg2);border:1px solid var(--line)}
.item+.item{margin-top:8px}
.item .main-t{flex:1;min-width:0}
.item .main-t b{display:block}
.item .time{font-size:.82rem;color:var(--muted);white-space:nowrap}
.item.done{opacity:.62} .item.done .tt{text-decoration:line-through}
.check{width:44px;height:44px;flex:none;border-radius:13px;border:2px solid #3a4780;background:transparent;display:grid;place-items:center;cursor:pointer;color:transparent}
.check[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#06281a}
.check:hover{border-color:var(--blue)}

/* timetable */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:12px 0}
.daytab{border:1px solid var(--line);background:var(--bg2);border-radius:14px;padding:8px 2px;text-align:center;cursor:pointer;min-height:58px;color:var(--muted)}
.daytab b{display:block;color:var(--text);font-size:1.05rem}
.daytab small{font-size:.68rem}
.daytab[aria-selected=true]{background:rgba(91,140,255,.18);border-color:var(--blue);color:var(--text)}
.daytab.today b::after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--amber);margin:2px auto 0}
.slot{display:grid;grid-template-columns:66px 1fr auto;gap:10px;align-items:center;padding:10px 10px 10px 0;border-radius:15px}
.slot .tm{font-size:.8rem;color:var(--muted);text-align:right;line-height:1.25}
.slot.sess{background:var(--card2);border:1px solid var(--line);border-left:5px solid var(--c);padding:10px}
.slot.sess .tm{text-align:left}
.slot.sess.done{opacity:.6}
.slot.sess.done .tt{text-decoration:line-through}
.slot.block{color:var(--faint);font-size:.9rem}
.slot.block .bx{border:1px dashed #34407a;border-radius:12px;padding:8px 10px}
.slot.brk{color:var(--faint);font-size:.82rem;padding-top:0;padding-bottom:0}
.slot+.slot{margin-top:6px}
.tip{font-size:.84rem;color:var(--muted);margin-top:2px}

/* learning hub */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin}
.chipbtn{flex:none;border:1px solid var(--line);background:var(--bg2);color:var(--muted);border-radius:99px;padding:8px 14px;cursor:pointer;min-height:40px;display:inline-flex;gap:8px;align-items:center}
.chipbtn[aria-pressed=true]{background:rgba(91,140,255,.2);border-color:var(--blue);color:var(--text)}
.chap{border:1px solid var(--line);background:var(--card);border-radius:16px;overflow:hidden}
.chap+.chap{margin-top:8px}
.chap-h{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;background:none;border:0;text-align:left;cursor:pointer;min-height:56px}
.chap-h .tt{flex:1;min-width:0}
.chap-h .tt b{display:block;line-height:1.3}
.chap-h .badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chap-b{padding:4px 14px 16px;border-top:1px solid var(--line)}
.res{display:block;padding:12px;border-radius:14px;background:var(--bg2);border:1px solid var(--line);text-decoration:none;color:var(--text)}
.res:hover{border-color:var(--blue)}
.res+.res{margin-top:8px}
.tag{font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--muted);margin-left:6px;vertical-align:middle}
.tag.off{background:rgba(70,220,155,.15);color:#8ef0c3}
.tog{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:12px;padding:8px 12px;min-height:40px;cursor:pointer}
.tog[aria-pressed=true]{background:rgba(70,220,155,.16);border-color:rgba(70,220,155,.5);color:#a7f3d0}
.tog.hard[aria-pressed=true]{background:rgba(255,138,154,.16);border-color:rgba(255,138,154,.5);color:#ffc0c9}

/* forms */
.field{margin-bottom:12px}
.field label,.lbl{display:block;font-size:.88rem;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#0d142e;font-size:16px}
textarea{min-height:84px;resize:vertical}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#a3aed6 50%),linear-gradient(135deg,#a3aed6 50%,transparent 50%);background-position:calc(100% - 20px) 20px,calc(100% - 14px) 20px;background-size:6px 6px;background-repeat:no-repeat;padding-right:34px}
.field.bad input,.field.bad select{border-color:var(--coral)}
.err{color:#ffb0bb;font-size:.84rem;margin-top:4px}
.formgrid{display:grid;gap:0 12px;grid-template-columns:1fr 1fr}
.formgrid .full{grid-column:1/-1}
@media(max-width:380px){.formgrid{grid-template-columns:1fr}}
.dchips{display:flex;gap:6px;flex-wrap:wrap}
.dchips label{position:relative;margin:0}
.dchips input{position:absolute;opacity:0;inset:0;cursor:pointer}
.dchips span{display:grid;place-items:center;min-width:48px;min-height:42px;padding:0 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--muted);font-size:.9rem}
.dchips input:checked+span{background:rgba(91,140,255,.22);border-color:var(--blue);color:var(--text)}
.dchips input:focus-visible+span{outline:3px solid #9db9ff;outline-offset:2px}
.steps{display:flex;gap:6px;margin:4px 0 16px}
.steps i{flex:1;height:6px;border-radius:99px;background:#222c57}
.steps i.on{background:var(--grad)}
.sub-card{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--bg2)}
.sub-card+.sub-card{margin-top:10px}
.stickybar{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:space-between;padding:10px;margin-top:16px;background:rgba(10,15,36,.92);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:18px;z-index:5}
@media(min-width:900px){.stickybar{bottom:16px}}

/* charts & small visuals */
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.84rem;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;gap:6px;align-items:center}
.cols7{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px}
.cols7 div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;font-size:.72rem;color:var(--muted)}
.cols7 i{display:block;width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:var(--grad);min-height:3px}
.badge{display:flex;gap:12px;align-items:center;padding:12px;border-radius:15px;border:1px solid var(--line);background:var(--bg2)}
.badge .em{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--grad);flex:none}
.badge.locked{opacity:.55} .badge.locked .em{background:#222c57;color:var(--faint)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:.82rem}

/* toast & modal */
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:60;
  display:flex;gap:12px;align-items:center;max-width:min(92vw,480px);padding:12px 16px;border-radius:15px;background:#222c57;border:1px solid #3a4780;box-shadow:var(--shadow);transition:.25s}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
@media(min-width:900px){#toast{bottom:28px}}
#modal{position:fixed;inset:0;z-index:70;background:rgba(3,6,20,.7);display:grid;place-items:center;padding:20px}
#modal[hidden]{display:none}
.dialog{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;max-width:420px;width:100%}
.dialog p{margin:8px 0 16px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
<style id="redesign">
/* =========================================================
   Redesign layer: light slate canvas, white cards, indigo actions, mint completion.
   Loaded after the base styles so it overrides them.
   ========================================================= */
:root{
  --bg:#F8FAFC; --bg2:#F8FAFC; --card:#FFFFFF; --card2:#F8FAFC; --line:#E2E8F0;
  --text:#0F172A; --muted:#475569; --faint:#64748B;
  --blue:#4F46E5; --indigo:#4F46E5; --indigo-d:#4338CA; --indigo-t:#EEF2FF;
  --mint:#10B981; --mint-d:#047857; --mint-t:#ECFDF5;
  --purple:#4F46E5; --teal:#10B981; --green:#10B981; --amber:#D97706; --coral:#E11D48;
  --grad:#4F46E5; --shadow:0 1px 2px rgba(15,23,42,.04);
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
}
body{background:#F8FAFC;background-image:none;color:var(--text);padding-top:env(safe-area-inset-top,0px);
  font-family:"Instrument Sans","Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
h1,h2,h3{font-family:var(--display);font-weight:700}
h1{font-size:1.3rem} @media(min-width:900px){h1{font-size:1.5rem}}
a{color:var(--indigo)}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}

/* chrome */
.logo{background:var(--indigo);border-radius:8px;box-shadow:none}
.bottomnav{background:#fff;backdrop-filter:none;border-top:1px solid var(--line)}
.bottomnav a[aria-current=page]{color:var(--indigo-d);background:var(--indigo-t)}
.bottomnav a[aria-current=page] svg{color:var(--indigo)}
@media(min-width:900px){
  .side{background:#fff;border-right:1px solid var(--line)}
  .side nav a:hover{background:#F1F5F9;color:var(--text)}
  .side nav a[aria-current=page]{background:var(--indigo-t);color:var(--indigo-d);box-shadow:inset 3px 0 0 var(--indigo);border-radius:4px 12px 12px 4px}
  .side nav a[aria-current=page] svg{color:var(--indigo)}
}

/* surfaces */
.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.card.flat{background:#F8FAFC;box-shadow:none}
.card.note{background:#F8FAFC;box-shadow:none}
.q{border-radius:14px;box-shadow:var(--shadow)}
.q-1{--rail:#E11D48} .q-2{--rail:#4F46E5} .q-3{--rail:#10B981}
.insight.focus .t{color:#BE123C} .insight.watch .t{color:#B45309} .insight.good .t{color:var(--mint-d)} .insight.info .t{color:var(--indigo-d)}
.insight .next{background:#F1F5F9}
.dialog{border-radius:14px}
#modal{background:rgba(15,23,42,.45)}
#toast{background:#0F172A;color:var(--text);border-color:#0F172A;box-shadow:none}
#toast .btn.ghost{background:transparent;color:var(--text);border-color:#475569}

/* controls */
.btn{background:var(--indigo);border-radius:10px;color:var(--text);transition:background .15s,transform .15s}
.btn:hover{background:var(--indigo-d);filter:none}
.btn.ghost{background:#fff;border-color:#CBD5E1;color:var(--text)}
.btn.ghost:hover{background:#F1F5F9}
.btn.danger{background:#DC2626}
.iconbtn{background:#fff;border-radius:10px;color:var(--muted)}
.iconbtn:hover{color:var(--text);background:#F1F5F9}
.iconbtn[aria-pressed=true]{color:#B45309;border-color:#F59E0B;background:#FFFBEB}
.pill{background:var(--indigo-t);color:var(--indigo-d);border-radius:6px}
.pill.good{background:var(--mint-t);color:var(--mint-d)}
.pill.warn{background:#FFFBEB;color:#B45309}
.pill.bad{background:#FEF2F2;color:#B91C1C}
.pill.plain{background:#F1F5F9;color:#475569}
.notice{background:#FFFBEB;border-color:#FDE68A;border-radius:12px}
.notice.info{background:var(--indigo-t);border-color:#C7D2FE}
.bar,.bar.thin{background:#E2E8F0}
.bar{height:8px} .bar.thin{height:6px}
.bar b{background:#0F172A;opacity:1}
.check{border-color:#CBD5E1;border-radius:10px;background:#fff}
.check[aria-pressed=true]{background:var(--mint);border-color:var(--mint);color:var(--text)}
.check:hover{border-color:var(--indigo)}
.item,.slot.sess{border-radius:12px}
.daytab{background:#fff;border-radius:10px}

<script>
'use strict';
/* ==========================================================================

   Part 1: LOGIC   (pure functions: marks, analysis, timetable)
   Part 2: APP     (saving data, screens, buttons)
   Beginner tip: to change subjects or chapters, edit CHAPTER_DATA below.

/* ===== LOGIC START ===== */
const SUBJECTS_META = [

  { id:'ai',   name:'Artificial Intelligence',short:'AI',      color:'#0284C7', defaultMax:50 }
];

/* SAMPLE chapter lists: [group, [chapter names]]. Check them against your school's current syllabus. */
const CHAPTER_DATA = {
  math:[
    ['Number systems',['Real Numbers']],
    ['Algebra',['Polynomials','Pair of Linear Equations in Two Variables','Quadratic Equations','Arithmetic Progressions']],
    ['Geometry',['Triangles','Circles']],

    ['Mensuration',['Areas Related to Circles','Surface Areas and Volumes']],
    ['Statistics and probability',['Statistics','Probability']]
  ],
  sci:[
    ['Chemical substances',['Chemical Reactions and Equations','Acids, Bases and Salts','Metals and Non-metals','Carbon and its Compounds']],
    ['World of living',['Life Processes','Control and Coordination','How do Organisms Reproduce?','Heredity']],
    ['Light and electricity',['Light – Reflection and Refraction','The Human Eye and the Colourful World','Electricity','Magnetic Effects of Electric Current']],
    ['Environment',['Our Environment']]
  ],
  sst:[
    ['History',['The Rise of Nationalism in Europe','Nationalism in India','The Making of a Global World','The Age of Industrialisation','Print Culture and the Modern World']],
    ['Geography',['Resources and Development','Forest and Wildlife Resources','Water Resources','Agriculture','Minerals and Energy Resources','Manufacturing Industries','Lifelines of National Economy']],
    ['Political Science',['Power Sharing','Federalism','Gender, Religion and Caste','Political Parties','Outcomes of Democracy']],
    ['Economics',['Development','Sectors of the Indian Economy','Money and Credit','Globalisation and the Indian Economy','Consumer Rights']]
  ],
  eng:[
    ['Reading and writing',['Reading comprehension (unseen passages)','Writing: formal letter','Writing: article and analytical paragraph','Grammar: tenses and modals','Grammar: editing, omission and reported speech']],
    ['First Flight (prose and play)',['A Letter to God','Nelson Mandela: Long Walk to Freedom','Two Stories about Flying','From the Diary of Anne Frank','Glimpses of India','Mijbil the Otter','Madam Rides the Bus','The Sermon at Benares','The Proposal']],
    ['First Flight (poems)',['Poems: Dust of Snow and Fire and Ice','Poems: A Tiger in the Zoo and How to Tell Wild Animals','Poems: The Ball Poem and Amanda!','Poems: The Trees and Fog','Poems: The Tale of Custard the Dragon and For Anne Gregory']],
    ['Footprints without Feet',['A Triumph of Surgery','The Thief\u2019s Story','The Midnight Visitor','A Question of Trust','Footprints without Feet','The Making of a Scientist','The Necklace','Bholi','The Book That Saved the Earth']]
  ],
  fre:[
    ['Vocabulary themes',['Family and friends','Town and transport','Hobbies and sports','Food and eating out']],
    ['Grammar',['Articles and prepositions','Present tense and irregular verbs','Pass\u00e9 compos\u00e9','Futur proche and imparfait','Pronouns and negation']],
    ['Reading and writing',['Reading passages (compr\u00e9hension \u00e9crite)','Letter, message and dialogue writing','Paragraph writing']]
  ],
  ai:[
    ['Part A: Employability skills',['Communication skills','Self-management skills','ICT skills','Entrepreneurial skills','Green skills']],
    ['Part B: Subject skills',['Revisiting AI Project Cycle and Ethical Frameworks for AI','Advanced Concepts of Modelling in AI','Evaluating Models','Statistical Data','Computer Vision','Natural Language Processing']]
  ]
};

/* Official websites. Only links we have confirmed as official are listed here. Edit with care: never add a link you have not checked. */
const OFFICIAL_LINKS = [
  { id:'ncert', title:'NCERT textbooks (official portal)', url:'https://ncert.nic.in/textbook.php', note:'Choose Class X and your subject to read the textbook.' },
  { id:'cbse', title:'CBSE Academic (official)', url:'https://cbseacademic.nic.in/', note:'Syllabus, sample question papers and marking schemes. Look under the Class 10 sections.' },
  { id:'sample', title:'CBSE secondary resources (official)', url:'https://cbseacademic.nic.in/resources-sec.html', note:'Sample question papers, marking schemes and other Class 10 material.' },
  { title:'CBSE main website (official)', url:'https://www.cbse.gov.in/', note:'Circulars, exam notices and announcements.' }
];

const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DAYS_LONG = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const AFTER_SCHOOL_BUFFER = 45;  // minutes of rest and travel after school
const TUITION_BUFFER = 15;       // minutes of travel before and after tuition
const BEFORE_SCHOOL_BUFFER = 60; // getting ready and travelling to school
const WIND_DOWN = 45;            // no study in the last 45 minutes before bedtime
const MIN_SESSION = 20;          // shortest useful session
const EARLIEST_START = 7*60+30;  // never plan study before 7:30 am

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const r1 = v => Math.round(v*10)/10;
const uid = () => Math.random().toString(36).slice(2,9);
function num(v){ if(v==null) return NaN; if(typeof v==='number') return isFinite(v)?v:NaN; const s=String(v).trim(); if(s==='') return NaN; const n=Number(s); return isFinite(n)?n:NaN; }
function joinList(a){ return a.length<2 ? a.join('') : a.slice(0,-1).join(', ')+' and '+a[a.length-1]; }

/* ---- dates and times ---- */
function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function dateKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseKey(k){ const p=k.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); }
function isDateKey(k){ return typeof k==='string' && /^\d{4}-\d{2}-\d{2}$/.test(k) && dateKey(parseKey(k))===k; }
function addDays(d,n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); }
function daysBetween(a,b){ return Math.round((startOfDay(b)-startOfDay(a))/86400000); }
function dayIdx(d){ return (d.getDay()+6)%7; }                 // Monday = 0 ... Sunday = 6
function mondayOf(d){ return addDays(startOfDay(d), -dayIdx(d)); }
function isTime(t){ return typeof t==='string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(t); }
function toMin(t){ const p=t.split(':').map(Number); return p[0]*60+p[1]; }
function fmtTime(m){ m=((m%1440)+1440)%1440; let h=Math.floor(m/60); const mm=m%60; const ap=h>=12?'pm':'am'; h=h%12||12; return h+':'+pad(mm)+' '+ap; }
function fmtDate(k){ return parseKey(k).toLocaleDateString(undefined,{day:'numeric',month:'short'}); }

/* ---- small state helpers ---- */
const meta = id => SUBJECTS_META.find(m=>m.id===id);
const activeSubjects = st => (st.subjects||[]).filter(s=>s.enabled);
const chKey = (sid,name) => sid+'|'+name;
const chState = (st,sid,name) => (st.chapters && st.chapters[chKey(sid,name)]) || {};
function chaptersOf(sid){ const out=[]; (CHAPTER_DATA[sid]||[]).forEach(g=>g[1].forEach(n=>out.push({name:n,group:g[0]}))); return out; }
function examDaysLeft(st, now){ const k=st.setup && st.setup.examDate; return isDateKey(k) ? daysBetween(now, parseKey(k)) : NaN; }

/* ---- sample data (clearly labelled in the app) ---- */
function makeSampleState(now){
  const today = startOfDay(now);
  const subjects = [
    { id:'math', enabled:true, current:44, max:80, target:64, feel:'hard' },
    { id:'sci',  enabled:true, current:38, max:80, target:60, feel:'hard' },
    { id:'sst',  enabled:true, current:57, max:80, target:64, feel:'ok' },
    { id:'eng',  enabled:true, current:57, max:80, target:64, feel:'easy' },
    { id:'fre',  enabled:true, current:50, max:80, target:60, feel:'ok' },
    { id:'ai',   enabled:true, current:33, max:50, target:40, feel:'ok' }
  ];
  const series = { math:[40,38,42,44], sci:[45,42,40,38], sst:[50,52,55,57], eng:[56,55,58,57], fre:[46,48,45,50], ai:[30,28,32,33] };
  const labels = ['Unit Test 1','Unit Test 2','Practice Test','Mock Test 1'];
  const offs = [-84,-56,-28,-7];
  const tests = [];
  subjects.forEach(s => series[s.id].forEach((m,i) => tests.push({ id:'t-'+s.id+i, subjectId:s.id, label:labels[i], date:dateKey(addDays(today,offs[i])), marks:m, max:s.max })));
  const chapters = {};
  const mark = (sid, names, f) => names.forEach(n => { chapters[chKey(sid,n)] = Object.assign(chapters[chKey(sid,n)]||{}, f); });
  mark('math',['Real Numbers','Polynomials','Pair of Linear Equations in Two Variables','Arithmetic Progressions'],{done:true});
  mark('math',['Real Numbers','Polynomials'],{revised:true});
  mark('math',['Quadratic Equations','Triangles','Introduction to Trigonometry'],{hard:true});
  mark('sci',['Chemical Reactions and Equations','Acids, Bases and Salts','Metals and Non-metals','Life Processes'],{done:true});
  mark('sci',['Chemical Reactions and Equations','Acids, Bases and Salts'],{revised:true});
  mark('sci',['Carbon and its Compounds','Electricity','Light – Reflection and Refraction'],{hard:true});
  mark('sst',['The Rise of Nationalism in Europe','Nationalism in India','Resources and Development','Power Sharing','Development'],{done:true});
  mark('eng',['Writing: formal letter'],{hard:true});
  mark('fre',['Pass\u00e9 compos\u00e9'],{hard:true});
  mark('ai',['Evaluating Models'],{hard:true});
  const log = [];
  [[-1,'math','learn'],[-2,'sci','revise'],[-3,'eng','practice'],[-5,'sst','learn']].forEach((x,i)=>log.push({ sid:'sample-'+i, date:dateKey(addDays(today,x[0])), subjectId:x[1], minutes:40, type:x[2] }));
  const wk = mondayOf(today);
  return {
    v:1, isSample:true,
    setup:{
      name:'Sample Student', examDate:dateKey(addDays(today,100)),
      schoolDays:[0,1,2,3,4], schoolStart:'08:00', schoolEnd:'14:30',
      tuitionDays:[0,2], tuitionStart:'17:00', tuitionEnd:'18:30',
      bedtime:'22:30', wake:'06:00', weekdayHours:2.5, weekendHours:4, sessionMin:40,
      others:[
        { id:'o1', label:'Dinner and family time', day:-1, start:'19:30', end:'20:15' },
        { id:'o2', label:'Football practice', day:5, start:'16:00', end:'17:30' }
      ]
    },
    subjects, tests, chapters, plan:null, log,
    weekHistory:[
      { weekStart:dateKey(addDays(wk,-21)), planned:24, done:9 },
      { weekStart:dateKey(addDays(wk,-14)), planned:25, done:13 },
      { weekStart:dateKey(addDays(wk,-7)),  planned:26, done:16 }
    ],
    tasks:[
      { id:'k1', title:'Finish trigonometry worksheet', desc:'Questions 1 to 12 on heights and distances.', subjectId:'math', chapter:'Introduction to Trigonometry', type:'homework', priority:'high', due:dateKey(addDays(today,2)), done:false },
      { id:'k2', title:'Write the electricity notes neatly', subjectId:'sci', chapter:'Electricity', type:'assignment', priority:'med', due:dateKey(addDays(today,4)), done:false },
      { id:'k3', title:'Learn 15 French verbs', subjectId:'fre', type:'revision', priority:'low', due:dateKey(addDays(today,3)), done:false },
      { id:'k4', title:'Practise one formal letter', subjectId:'eng', chapter:'Writing: formal letter', type:'practice', priority:'high', due:dateKey(addDays(today,0)), done:false },
      { id:'k6', title:'Science chapter test: Carbon compounds', subjectId:'sci', chapter:'Carbon and its Compounds', type:'practice', priority:'high', due:dateKey(addDays(today,-1)), done:false },
      { id:'k5', title:'Revise Real Numbers formulas', subjectId:'math', chapter:'Real Numbers', type:'revision', priority:'med', due:dateKey(addDays(today,-2)), done:true, doneOn:dateKey(addDays(today,-3)) }
    ],
    reflections:{}
  };
}

/* ---- marks and analysis ---- */
function validTest(t){ const mx=num(t.max), mk=num(t.marks); return mx>0 && mk>=0 && mk<=mx && isDateKey(t.date); }
function testsFor(st, sid){
  return (st.tests||[]).filter(t => t.subjectId===sid && validTest(t))
    .sort((a,b) => a.date<b.date?-1 : a.date>b.date?1 : 0);
}
function testPct(t){ return num(t.marks)/num(t.max)*100; }
function testTrend(st, sid){
  const t = testsFor(st, sid);
  return t.length<2 ? NaN : testPct(t[t.length-1]) - testPct(t[t.length-2]);
}
function subjectRows(st){
  return activeSubjects(st).map(s => {
    const m = meta(s.id), cu=num(s.current), mx=num(s.max), tg=num(s.target);
    const valid = mx>0 && cu>=0 && cu<=mx;
    const pct = valid ? cu/mx*100 : NaN;
    const targetPct = (mx>0 && tg>=0 && tg<=mx) ? tg/mx*100 : NaN;
    const gap = (isFinite(pct)&&isFinite(targetPct)) ? targetPct-pct : NaN;
    const trend = testTrend(st, s.id);
    const tl = testsFor(st, s.id), nT = tl.length;
    const declining = nT>=3 && testPct(tl[nT-1])<testPct(tl[nT-2]) && testPct(tl[nT-2])<testPct(tl[nT-3]);
    const hardAll = chaptersOf(s.id).filter(c => chState(st,s.id,c.name).hard).map(c=>c.name);
    const hardPending = hardAll.filter(n => !chState(st,s.id,n).done);
    const feelBonus = s.feel==='hard' ? 8 : s.feel==='ok' ? 3 : 0;
    const score = (gap>0?gap:0) + feelBonus + Math.min(hardPending.length*1.5, 9) + ((trend<=-3||declining)?5:0) + 5;
    let status = 'Add your marks', cls='plain';
    if(isFinite(gap)){
      if(gap<=0){ status='Target reached'; cls='good'; }
      else if(gap<=5){ status='Almost there'; cls='good'; }
      else if(gap<=12){ status='Needs steady work'; cls='warn'; }
      else { status='Needs the most attention'; cls='bad'; }
    }
    return { id:s.id, name:m.name, short:m.short, color:m.color, feel:s.feel, cur:cu, max:mx, tgt:tg, pct, targetPct, gap,
      gapMarks:(isFinite(tg)&&isFinite(cu))?tg-cu:NaN, trend, declining, hardAll, hardPending, score, status, cls };
  });
}
function overall(st){
  let cu=0, mx=0, tg=0, n=0;
  subjectRows(st).forEach(r => { if(isFinite(r.pct) && isFinite(r.targetPct)){ cu+=r.cur; mx+=r.max; tg+=r.tgt; n++; } });
  if(!mx) return { pct:NaN, targetPct:NaN, gap:NaN, count:0 };
  return { pct:cu/mx*100, targetPct:tg/mx*100, gap:tg/mx*100-cu/mx*100, count:n, cur:cu, max:mx, tgt:tg };
}
/* Overall % after each test date, using the latest score of every subject so far. */
function overallSeries(st){
  const act = activeSubjects(st); const byId={}; act.forEach(s=>byId[s.id]=s);
  const tests = (st.tests||[]).filter(t=>byId[t.subjectId] && validTest(t)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  const latest={}, pts=[]; let started=false;
  tests.forEach(t => {
    latest[t.subjectId]=t;
    const have=Object.keys(latest).length;
    if(have===act.length) started=true;
    let num_=0, den=0; Object.keys(latest).forEach(id => { const sub=byId[id], m=num(sub.max); num_+=testPct(latest[id])/100*m; den+=m; });
    const p = { date:t.date, pct:num_/den*100, full:started };
    if(pts.length && pts[pts.length-1].date===t.date) pts[pts.length-1]=p; else pts.push(p);
  });
  const full = pts.filter(p=>p.full);
  return full.length>=2 ? full : pts;
}

/* ---- the timetable ---- */
function blockedForDay(setup, day){
  const out=[];
  if((setup.schoolDays||[]).includes(day) && isTime(setup.schoolStart) && isTime(setup.schoolEnd)){
    const s=toMin(setup.schoolStart), e=toMin(setup.schoolEnd);
    if(e>s){ out.push({start:s-BEFORE_SCHOOL_BUFFER,end:s,kind:'buffer',label:'Rest and travel'}); out.push({start:s,end:e,kind:'school',label:'School'}); out.push({start:e,end:e+AFTER_SCHOOL_BUFFER,kind:'buffer',label:'Rest and travel'}); }
  }
  if((setup.tuitionDays||[]).includes(day) && isTime(setup.tuitionStart) && isTime(setup.tuitionEnd)){
    const s=toMin(setup.tuitionStart), e=toMin(setup.tuitionEnd);
    if(e>s){
      out.push({start:s-TUITION_BUFFER,end:s,kind:'buffer',label:'Rest and travel'});
      out.push({start:s,end:e,kind:'tuition',label:'Tuition'});
      out.push({start:e,end:e+TUITION_BUFFER,kind:'buffer',label:'Rest and travel'});
    }
  }
  (setup.others||[]).forEach(o => {
    const d=Number(o.day);
    if((d===-1 || d===day) && isTime(o.start) && isTime(o.end) && toMin(o.end)>toMin(o.start))
      out.push({start:toMin(o.start),end:toMin(o.end),kind:'other',label:o.label||'Busy'});
  });
  return out;
}
function subtractBlocks(intervals, blocks, minLen){
  let res = intervals.slice();
  blocks.forEach(b => {
    const next=[];
    res.forEach(iv => {
      if(b.end<=iv.start || b.start>=iv.end){ next.push(iv); return; }
      if(b.start>iv.start) next.push({start:iv.start,end:b.start});
      if(b.end<iv.end) next.push({start:b.end,end:iv.end});
    });
    res=next;
  });
  return res.filter(iv => iv.end-iv.start>=minLen).sort((a,b)=>a.start-b.start);
}
function studyWindow(setup){
  const wake = isTime(setup.wake)?toMin(setup.wake):6*60, bed = isTime(setup.bedtime)?toMin(setup.bedtime):22*60+30;
  return { start:Math.max(wake+60, EARLIEST_START), end:Math.min(bed-WIND_DOWN, 23*60+30) };
}
function freeIntervalsForDay(setup, day){
  const w=studyWindow(setup);
  if(w.end-w.start<MIN_SESSION) return [];
  return subtractBlocks([{start:w.start,end:w.end}], blockedForDay(setup,day), MIN_SESSION);
}
/* Blocks to show in the timetable view (buffers merged and hidden behind real blocks). */
function displayBlocks(setup, day){
  const all=blockedForDay(setup,day);
  const real=all.filter(b=>b.kind!=='buffer');
  let bufs=all.filter(b=>b.kind==='buffer').sort((a,b)=>a.start-b.start);
  const merged=[]; bufs.forEach(b=>{ const l=merged[merged.length-1]; if(l && b.start<=l.end) l.end=Math.max(l.end,b.end); else merged.push({start:b.start,end:b.end}); });
  const bufLeft=subtractBlocks(merged, real, 1).map(b=>({start:b.start,end:b.end,kind:'buffer',label:'Rest and travel'}));
  return real.concat(bufLeft).sort((a,b)=>a.start-b.start);
}
/* All possible study slots for the week, before subjects are chosen. */
function buildDaySlots(setup){
  const S = clamp(Number(setup.sessionMin)||40, 20, 90);
  const brk = S<=30 ? 5 : 10;
  const res=[];
  for(let d=0; d<7; d++){
    const hrs = (setup.schoolDays||[]).includes(d) ? num(setup.weekdayHours) : num(setup.weekendHours);
    const cap = Math.round((isFinite(hrs)?hrs:0)*60);
    let used=0; const items=[];
    freeIntervalsForDay(setup,d).forEach(iv => {
      let t=iv.start;
      while(used+MIN_SESSION<=cap && t+MIN_SESSION<=iv.end){
        const len=Math.min(S, iv.end-t, cap-used);
        items.push({kind:'session',day:d,start:t,end:t+len}); used+=len; t+=len;
        if(used+MIN_SESSION<=cap && t+brk+MIN_SESSION<=iv.end){ items.push({kind:'break',day:d,start:t,end:t+brk}); t+=brk; }
        else break;
      }
    });
    res.push({ day:d, items, minutes:used, wanted:cap });
  }
  return res;
}
function weeklyPlannedMinutes(setup){ return buildDaySlots(setup).reduce((a,d)=>a+d.minutes,0); }

function quotas(weights, N){
  const ids=Object.keys(weights); const total=ids.reduce((a,i)=>a+weights[i],0)||1; const q={}; let used=0; const rem=[];
  ids.forEach(i => { const x=weights[i]/total*N; q[i]=Math.floor(x); used+=q[i]; rem.push([i,x-q[i]]); });
  rem.sort((a,b)=>b[1]-a[1]);
  for(let k=0; used<N && rem.length; k=(k+1)%rem.length){ q[rem[k][0]]++; used++; }
  if(N>=ids.length){
    ids.forEach(i => { if(q[i]<1){ const donor=ids.reduce((a,b)=>q[b]>q[a]?b:a); if(q[donor]>1){ q[donor]--; q[i]=1; } } });
  }
  return q;
}
function revisionShareFor(daysLeft){ return !isFinite(daysLeft)?0.25 : daysLeft>60?0.2 : daysLeft>30?0.35 : daysLeft>14?0.5 : 0.7; }
function makePicker(st, sid, share){
  const chs = chaptersOf(sid).map(c=>({name:c.name, s:chState(st,sid,c.name)}));
  const byHard = (a,b) => (b.s.hard?1:0)-(a.s.hard?1:0);
  const pending = chs.filter(c=>!c.s.done).sort(byHard);                       // stable sort keeps syllabus order
  const revisable = chs.filter(c=>c.s.done && !c.s.revised).sort(byHard);
  const doneAll = chs.filter(c=>c.s.done);
  const counts={}; let revN=0, total=0, revIdx=0;
  return function next(){
    total++;
    if(revisable.length && revN/Math.max(total-1,1) < share){ revN++; const c=revisable[revIdx++%revisable.length]; return {type:'revise', focus:c.name}; }
    if(pending.length){
      let c=pending.find(x=>(counts[x.name]||0)<2);
      if(!c){ for(const k in counts) counts[k]=0; c=pending[0]; }
      const type = (counts[c.name]||0)===0 ? 'learn' : 'practice';
      counts[c.name]=(counts[c.name]||0)+1;
      return {type, focus:c.name};
    }
    if(doneAll.length){ revN++; const c=doneAll[revIdx++%doneAll.length]; return {type:'revise', focus:c.name}; }
    return {type:'practice', focus:'Mixed practice questions'};
  };
}
function generatePlan(st, now, opts){
  opts = opts || {};
  const setup=st.setup, act=activeSubjects(st);
  const weekStart=dateKey(mondayOf(now)), today=dayIdx(now), nowMin=now.getHours()*60+now.getMinutes();
  const kept = (opts.keepDone && st.plan && st.plan.weekStart===weekStart) ? st.plan.sessions.filter(s=>s.kind==='session' && s.done) : [];
  let flat=[]; buildDaySlots(setup).forEach(d=>d.items.forEach(it=>flat.push(it)));
  flat = flat.filter(it => it.day>today || (it.day===today && (!opts.strict || it.start>=nowMin)));
  flat = flat.filter(it => !kept.some(k => k.day===it.day && k.start<it.end && k.end>it.start));
  flat.sort((a,b)=>a.day-b.day||a.start-b.start);
  const slots = flat.filter(x=>x.kind==='session');
  const N = slots.length;
  let sessions=[];
  if(act.length && N){
    const rows = subjectRows(st); const weights={}; rows.forEach(r=>weights[r.id]=Math.max(r.score,1));
    const ids=Object.keys(weights);
    let reviewSlot=null;
    if(N>=8){ const sun=slots.filter(s=>s.day===6); reviewSlot = sun.length ? sun[sun.length-1] : slots[N-1]; }
    const q = quotas(weights, N-(reviewSlot?1:0));
    const share = revisionShareFor(examDaysLeft(st,now));
    const pickers={}; ids.forEach(id=>pickers[id]=makePicker(st,id,share));
    let prev=null, curDay=-1, dayCount={};
    slots.forEach(sl => {
      if(sl.day!==curDay){ curDay=sl.day; dayCount={}; }
      if(sl===reviewSlot){
        sessions.push({id:weekStart+'-'+sl.day+'-'+sl.start,kind:'session',day:sl.day,start:sl.start,end:sl.end,subjectId:'all',type:'review',focus:'Weekly review and reflection',done:false});
        prev='all'; return;
      }
      let best=null, bs=-1e9;
      ids.forEach(id => { if(q[id]<=0) return; let sc=q[id]*10+weights[id]*0.05; if(prev===id) sc-=50; sc-=(dayCount[id]||0)*8; if(sc>bs){bs=sc;best=id;} });
      if(!best) best=ids.reduce((a,b)=>weights[b]>weights[a]?b:a);
      q[best]--; dayCount[best]=(dayCount[best]||0)+1; prev=best;
      const p=pickers[best]();
      sessions.push({id:weekStart+'-'+sl.day+'-'+sl.start,kind:'session',day:sl.day,start:sl.start,end:sl.end,subjectId:best,type:p.type,focus:p.focus,done:false});
    });
  }
  /* keep a break only when it sits between two sessions of the same day */
  const all = sessions.concat(flat.filter(x=>x.kind==='break').map(b=>({id:weekStart+'-b-'+b.day+'-'+b.start,kind:'break',day:b.day,start:b.start,end:b.end})))
    .concat(kept).sort((a,b)=>a.day-b.day||a.start-b.start);
  const out = all.filter((it,i) => it.kind!=='break' || (all[i-1] && all[i-1].kind==='session' && all[i-1].day===it.day && all[i-1].end===it.start
      && all[i+1] && all[i+1].kind==='session' && all[i+1].day===it.day && all[i+1].start===it.end));
  return { weekStart, generatedAt:now.toISOString(), sessions:out };
}
/* Safety check: returns a list of problems (empty list = every session is in free time). */
function validatePlan(setup, plan){
  const problems=[]; const w=studyWindow(setup);
  plan.sessions.filter(s=>s.kind==='session').forEach(s => {
    if(s.start<w.start || s.end>w.end) problems.push(s.id+' is outside the study window');
    blockedForDay(setup,s.day).forEach(b => { if(s.start<b.end && s.end>b.start) problems.push(s.id+' overlaps '+b.label); });
  });
  return problems;
}

/* ---- week, streak, badges ---- */
function weekStats(st, now){
  const sess=(st.plan?st.plan.sessions:[]).filter(s=>s.kind==='session'); const today=dayIdx(now), nowMin=now.getHours()*60+now.getMinutes();
  const sofar=sess.filter(s=>s.day<today || (s.day===today && s.end<=nowMin));
  return { planned:sess.length, done:sess.filter(s=>s.done).length, plannedSoFar:sofar.length, doneSoFar:sofar.filter(s=>s.done).length,
           minutesDone:sess.filter(s=>s.done).reduce((a,s)=>a+s.end-s.start,0) };
}
function activityDates(st){
  const set=new Set((st.log||[]).map(l=>l.date)); (st.tasks||[]).forEach(t=>{ if(t.done && t.doneOn) set.add(t.doneOn); }); return set;
}
function streakInfo(st, now){
  const set=activityDates(st); const today=startOfDay(now);
  let d = set.has(dateKey(today)) ? today : addDays(today,-1); let cur=0;
  while(set.has(dateKey(d))){ cur++; d=addDays(d,-1); }
  const sorted=Array.from(set).sort(); let best=0, run=0, prev=null;
  sorted.forEach(k => { run = (prev && daysBetween(parseKey(prev),parseKey(k))===1) ? run+1 : 1; if(run>best) best=run; prev=k; });
  return { current:cur, best, any:set.size>0, doneToday:set.has(dateKey(today)) };
}
function chapterTotals(st){
  let total=0, done=0, revised=0;
  activeSubjects(st).forEach(s => chaptersOf(s.id).forEach(c => { total++; const x=chState(st,s.id,c.name); if(x.done) done++; if(x.revised) revised++; }));
  return { total, done, revised };
}
function getBadges(st, now){
  const sc=streakInfo(st,now), ct=chapterTotals(st), ws=weekStats(st,now);
  const sessionsDone=(st.log||[]).length;
  const tasksDone=(st.tasks||[]).filter(t=>t.done).length;
  let climb=false; activeSubjects(st).forEach(s=>{ const t=testsFor(st,s.id); if(t.length>=2 && testPct(t[t.length-1])-testPct(t[0])>=5) climb=true; });
  return [
    { id:'first', name:'First step', desc:'Finish your first study session.', earned:sessionsDone>=1 },
    { id:'s3', name:'Three days running', desc:'Study on 3 days in a row.', earned:sc.best>=3 },
    { id:'s7', name:'One-week streak', desc:'Study on 7 days in a row.', earned:sc.best>=7 },
    { id:'wk', name:'Steady week', desc:'Finish 80% of a week\u2019s sessions.', earned:ws.planned>=5 && ws.done/ws.planned>=0.8 },
    { id:'tasks', name:'Task tidy-up', desc:'Complete 5 tasks.', earned:tasksDone>=5 },
    { id:'ch5', name:'Chapter climber', desc:'Mark 5 chapters as done.', earned:ct.done>=5 },
    { id:'rev5', name:'Revision habit', desc:'Mark 5 chapters as revised.', earned:ct.revised>=5 },
    { id:'up', name:'Score climber', desc:'Raise a subject by 5 points or more.', earned:climb },
    { id:'ref', name:'Reflector', desc:'Write a weekly reflection.', earned:Object.keys(st.reflections||{}).length>0 }
  ];
}

/* ---- insights: "What am I doing wrong?" ---- */
function estimateWorkHours(st){
  let h=0; activeSubjects(st).forEach(s=>chaptersOf(s.id).forEach(c=>{ const x=chState(st,s.id,c.name); if(!x.done) h+=1.5; if(!x.revised) h+=0.5; })); return h;
}
function estimateAvailableHours(st, now){
  const dl=examDaysLeft(st,now); if(!isFinite(dl)||dl<0) return NaN;
  return weeklyPlannedMinutes(st.setup)/60/7*dl;
}
function getInsights(st, now){
  const out=[]; const rows=subjectRows(st).filter(r=>isFinite(r.pct));
  if(!rows.length){
    out.push({id:'nodata',tone:'info',title:'Add your marks to get started',short:'Enter your latest marks and targets in Setup.',detail:'Once your marks and targets are in, this page shows where marks are slipping.',next:'Open Setup and complete step 2.'});
    return out;
  }
  const ranked=rows.slice().sort((a,b)=>b.score-a.score);
  const top=ranked[0];
  if(top && top.gap>0){
    const why=[];
    if(top.feel==='hard') why.push('you marked it as difficult');
    if(top.hardPending.length) why.push(top.hardPending.length+(top.hardPending.length>1?' tricky chapters are':' tricky chapter is')+' not finished');
    if(top.trend<=-3 || top.declining) why.push('your recent test scores have been going down');
    const ch = top.hardPending[0] || (chaptersOf(top.id).find(c=>!chState(st,top.id,c.name).done)||{}).name;
    out.push({ id:'gap', tone:'focus', title:top.name+' needs the most attention',
      short:r1(top.pct)+'% now, target '+r1(top.targetPct)+'%: a gap of '+r1(top.gap)+' points.',
      detail:'You are at '+r1(top.pct)+'% and your target is '+r1(top.targetPct)+'%. That is about '+Math.ceil(top.gapMarks)+' more marks. '+(why.length?'It comes first because '+joinList(why)+'.':''),
      next: ch ? 'Start with \u201c'+ch+'\u201d and plan 2 or 3 short sessions on it this week.' : 'Practise past questions and review your mistakes.' });
    const second=ranked[1];
    if(second && second.gap>=8) out.push({ id:'second', tone:'watch', title:'Also watch '+second.name,
      short:r1(second.pct)+'% now, target '+r1(second.targetPct)+'%.', detail:second.name+' is '+r1(second.gap)+' points below your target. Your timetable already gives it extra sessions.', next:'Check the timetable to see when it is scheduled.' });
  } else {
    out.push({ id:'ontarget', tone:'good', title:'Every subject is at or near its target', short:'Keep revising so marks stay steady.', detail:'Your current marks meet or nearly meet your targets. Consider raising a target if you want a bigger challenge.', next:'Use revision sessions and timed papers to stay sharp.' });
  }
  rows.filter(r=>r.trend<=-3 || r.declining).slice(0,2).forEach(r => {
    const t=testsFor(st,r.id), b=testPct(t[t.length-1]), a=testPct(t[t.length-2]);
    if(r.trend<=-3) out.push({ id:'drop-'+r.id, tone:'watch', title:r.name+': the last test went down',
      short:r1(Math.abs(r.trend))+' points lower than the test before.', detail:'Your last two '+r.name+' results were '+r1(a)+'% and then '+r1(b)+'%. One lower result does not decide anything, but it is worth understanding.',
      next:'Sort the marks you lost into three piles: did not know, forgot, careless. Study the biggest pile first.' });
    else { const c=testPct(t[t.length-3]);
      out.push({ id:'drop-'+r.id, tone:'watch', title:r.name+': scores have slipped three tests in a row',
      short:'Each of the last three tests was a little lower.', detail:'Your last three '+r.name+' results were '+r1(c)+'%, '+r1(a)+'% and '+r1(b)+'%. Small drops add up, so it is worth finding the cause now.',
      next:'Look at your last test paper and sort the lost marks into: did not know, forgot, careless. Study the biggest pile first.' }); }
  });
  rows.filter(r=>r.feel==='easy' && r.gap>8).slice(0,1).forEach(r => out.push({ id:'mismatch-'+r.id, tone:'watch', title:r.name+' feels easy, but there is still a gap',
    short:r1(r.pct)+'%, which is '+r1(r.gap)+' points under target.', detail:'You marked '+r.name+' as comfortable, so marks may be slipping on reading questions carefully, showing steps, or time, rather than on understanding.',
    next:'Do one timed paper and mark it strictly against the marking scheme.' }));
  const hardList=[]; rows.forEach(r=>r.hardPending.forEach(n=>hardList.push({n, s:r.short})));
  if(hardList.length) out.push({ id:'hard', tone:'info', title:hardList.length+' tricky chapter'+(hardList.length>1?'s':'')+' still to finish',
    short:hardList.slice(0,3).map(h=>h.n).join(', ')+(hardList.length>3?' and more':'')+'.',
    detail:'Chapters you flagged as difficult and have not finished: '+hardList.slice(0,6).map(h=>h.n+' ('+h.s+')').join(', ')+(hardList.length>6?' and '+(hardList.length-6)+' more':'')+'.',
    next:'Take one tricky chapter at a time, starting with the subject that has the biggest gap.' });
  const ws=weekStats(st,now);
  if(ws.plannedSoFar>=3){
    const ratio=ws.doneSoFar/ws.plannedSoFar;
    if(ratio<0.5) out.push({ id:'consistency', tone:'info', title:'This week\u2019s plan may be too heavy',
      short:'You finished '+ws.doneSoFar+' of '+ws.plannedSoFar+' sessions so far.', detail:'You finished '+ws.doneSoFar+' of the '+ws.plannedSoFar+' sessions scheduled so far this week. That is useful information about what fits your life, not a failure.',
      next:'Open Setup and try a shorter session length or fewer hours, then regenerate the plan.' });
    else if(ratio>=0.8) out.push({ id:'consistency', tone:'good', title:'You are keeping to your plan',
      short:ws.doneSoFar+' of '+ws.plannedSoFar+' sessions done so far.', detail:'Finishing most of your sessions is what turns a plan into progress.', next:'Keep the same rhythm.' });
  }
  const need=estimateWorkHours(st), have=estimateAvailableHours(st,now);
  if(isFinite(have) && need>0){
    if(need>have*0.9) out.push({ id:'time', tone:'watch', title:'Your timetable may be tight for the syllabus left',
      short:'About '+Math.round(need)+' hours of work left, about '+Math.round(have)+' hours of study time before the exam.',
      detail:'Rough estimate: unfinished chapters take about 1.5 hours each to learn and 0.5 hours to revise. Your timetable gives about '+Math.round(have)+' hours before your exam date, for about '+Math.round(need)+' hours of work.',
      next:'Add a little weekend time, or cover tricky and high-gap chapters first. A teacher can help you decide what to prioritise.' });
    else out.push({ id:'time', tone:'good', title:'Your study time looks workable',
      short:'About '+Math.round(have)+' hours available for about '+Math.round(need)+' hours of work.', detail:'This is a rough estimate (1.5 hours to learn a chapter, 0.5 to revise). If you keep to the timetable there is room for the syllabus and some extra practice.', next:'Keep sessions regular rather than catching up in one go.' });
  }
  const fewTests = rows.filter(r=>testsFor(st,r.id).length<2).length;
  if(fewTests) out.push({ id:'fewtests', tone:'info', title:'Add more test results to see your trend',
    short:fewTests+' subject'+(fewTests>1?'s have':' has')+' fewer than two results.', detail:'With two or more results per subject, the app can show whether you are improving.', next:'Use \u201cAdd a test result\u201d in My Marks after each test.' });
  return out;
}

/* ---- "Am I getting better?" ---- */
function trendSummary(st, now){
  const s=overallSeries(st); const last7=(st.log||[]).filter(l=>daysBetween(parseKey(l.date),now)<7 && daysBetween(parseKey(l.date),now)>=0);
  const effort = last7.length+(last7.length===1?' session':' sessions')+' in the last 7 days';
  if(s.length<2) return { tone:'info', head:'Not enough results yet', text:'Add at least two test results to see your trend. '+effort+'.', delta:NaN, effort, series:s };
  const first=s[0], last=s[s.length-1], prev=s[s.length-2];
  const dAll=last.pct-first.pct, dRecent=last.pct-prev.pct;
  if(dAll>=2) return { tone:'good', head:'Yes, you are moving up', text:'Overall is up '+r1(dAll)+' points since '+fmtDate(first.date)+' (latest change '+(dRecent>=0?'+':'')+r1(dRecent)+'). '+effort+'.', delta:dAll, effort, series:s };
  if(dAll>-2) return { tone:'info', head:'Holding steady', text:'Overall is about the same as on '+fmtDate(first.date)+'. Scores often level out before they rise. '+effort+'.', delta:dAll, effort, series:s };
  return { tone:'watch', head:'Not yet, and that is useful to know', text:'Overall is '+r1(Math.abs(dAll))+' points lower than on '+fmtDate(first.date)+'. Check \u201cWhat am I doing wrong?\u201d for where to look. '+effort+'.', delta:dAll, effort, series:s };
}

    try{ const raw=localStorage.getItem(STORE_KEY); if(raw){ const s=JSON.parse(raw); if(s && s.setup && Array.isArray(s.subjects)) return fillDefaults(s); } }catch(e){}
  }

}
function fillDefaults(s){
  s.tests=s.tests||[]; s.chapters=s.chapters||{}; s.log=s.log||[]; s.tasks=s.tasks||[]; s.reflections=s.reflections||{}; s.bookmarks=s.bookmarks||{}; s.weekHistory=s.weekHistory||[];
  s.setup.others=s.setup.others||[]; return s;
}

function bar(pct, color, target){

}
function ring(pct, target, caption, aria){
  const r=54, c=2*Math.PI*r, p=clamp(isFinite(pct)?pct:0,0,100), off=c*(1-p/100); let tick='';
  if(isFinite(target)){ const a=clamp(target,0,100)/100*2*Math.PI-Math.PI/2;
    tick='<line x1="'+(70+Math.cos(a)*(r-8))+'" y1="'+(70+Math.sin(a)*(r-8))+'" x2="'+(70+Math.cos(a)*(r+8))+'" y2="'+(70+Math.sin(a)*(r+8))+'" stroke="#0F172A" stroke-width="3"/>'; }
  const col=p>=100?'#10B981':'#4F46E5';
  return '<svg viewBox="0 0 140 140" class="ring gauge" role="img" aria-label="'+esc(aria||'Overall')+' '+Math.round(p)+' percent'+(isFinite(target)?', target '+Math.round(target)+' percent':'')+'">'
    +'<circle cx="70" cy="70" r="'+r+'" fill="none" stroke="#E2E8F0" stroke-width="10"/><circle cx="70" cy="70" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="10" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" transform="rotate(-90 70 70)"/>'
    +tick+'<text x="70" y="72" text-anchor="middle" font-size="30" font-weight="700" fill="#0F172A" style="font-family:var(--display)">'+(isFinite(pct)?Math.round(p)+'%':'\u2013')+'</text><text x="70" y="92" text-anchor="middle" font-size="11" fill="#64748B">'+esc(caption||'now')+'</text></svg>';
}
function spark(vals){
  if(vals.length<2) return '';
  const w=160,h=42,mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals), span=Math.max(mx-mn,4);
  const pts=vals.map((v,i)=>[3+i/(vals.length-1)*(w-6), h-5-((v-mn)/span)*(h-10)]);
  const last=pts[pts.length-1];
  return '<svg viewBox="0 0 '+w+' '+h+'" class="spark" preserveAspectRatio="none" aria-hidden="true"><polyline fill="none" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="'+pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')+'"/><circle cx="'+last[0]+'" cy="'+last[1]+'" r="3.5" fill="#4F46E5"/></svg>';
}
function lineChart(series, targetPct){
  const all=[]; series.forEach(s=>s.pts.forEach(p=>all.push(p)));
  if(!all.length) return '<div class="empty"><b>No test results yet</b>Add a test result in My Marks to see your trend here.</div>';
  const W=640,H=250,L=38,R=14,T=14,B=30;
  const xs=all.map(p=>p.t), x0=Math.min.apply(null,xs), x1=Math.max.apply(null,xs);
  const ys=all.map(p=>p.y); if(isFinite(targetPct)) ys.push(targetPct);
  let y0=Math.max(0,Math.floor((Math.min.apply(null,ys)-5)/10)*10), y1=Math.min(100,Math.ceil((Math.max.apply(null,ys)+5)/10)*10);
  if(y1-y0<20) y1=Math.min(100,y0+20);
  const X=t=>L+(x1===x0?(W-L-R)/2:(t-x0)/(x1-x0)*(W-L-R)), Y=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);
  const step=(y1-y0)>40?20:10; let g='';
  for(let v=y0; v<=y1; v+=step) g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="#E2E8F0" stroke-width="1"/><text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="11" fill="#64748B">'+v+'</text>';
  let tl=''; if(isFinite(targetPct)) tl='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(targetPct)+'" y2="'+Y(targetPct)+'" stroke="#0F172A" stroke-opacity=".5" stroke-dasharray="5 5"/><text x="'+(W-R)+'" y="'+(Y(targetPct)-5)+'" text-anchor="end" font-size="11" fill="#334155">target '+Math.round(targetPct)+'%</text>';
  const lines=series.map(s=>{
    const pts=s.pts.slice().sort((a,b)=>a.t-b.t);
    return '<polyline fill="none" stroke="'+s.color+'" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="'+pts.map(p=>X(p.t).toFixed(1)+','+Y(p.y).toFixed(1)).join(' ')+'"/>'
      +pts.map(p=>'<circle cx="'+X(p.t).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="4.5" fill="'+s.color+'" stroke="#fff" stroke-width="2"><title>'+esc(s.name)+': '+r1(p.y)+'% on '+esc(fmtDate(dateKey(new Date(p.t))))+'</title></circle>').join('');
  }).join('');
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Line chart of test percentages over time">'+g+tl+lines
    +'<text x="'+L+'" y="'+(H-8)+'" font-size="11" fill="#64748B">'+esc(fmtDate(dateKey(new Date(x0))))+'</text><text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end" font-size="11" fill="#64748B">'+esc(fmtDate(dateKey(new Date(x1))))+'</text></svg>';
}

function sessRowHTML(it){ const c=subjColor(it.subjectId), id=esc(it.id);
  return '<div class="slot sess '+(it.done?'done':'')+'" style="--c:'+c+'"><div class="tm"><b style="color:var(--text)">'+fmtTime(it.start)+'</b><br>'+fmtTime(it.end)+'</div><div><div class="tt" style="font-weight:650">'+esc(subjName(it.subjectId))+' · '+typeLabel(it.type)+'</div><div class="small muted">'+esc(it.focus)+'</div><div class="tip">'+esc(TIPS[it.type]||'')+'</div><div class="row" style="gap:6px;margin-top:6px"><button class="btn small ghost" data-act="editSess" data-id="'+id+'">Edit / reschedule</button><button class="btn small ghost" data-act="delSess" data-id="'+id+'">Delete</button></div></div><button class="check" data-act="toggleSession" data-id="'+id+'" aria-pressed="'+it.done+'" aria-label="'+(it.done?'Mark not done: ':'Mark done: ')+esc(subjName(it.subjectId)+' '+it.focus)+'">'+icon('check')+'</button></div>'; }
function editSession(id){
  const s=state.plan.sessions.find(x=>x.id===id); if(!s) return;
  const m=$('#modal'), tm=v=>pad(Math.floor(v/60))+':'+pad(v%60);
  m.innerHTML='<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">Edit session</h3><p class="muted small">'+esc(subjName(s.subjectId))+' · '+typeLabel(s.type)+'. Sessions must sit in free time and cannot overlap.</p><div class="formgrid"><div class="field full"><label for="esD">Day</label><select id="esD">'+DAYS_LONG.map((d,i)=>'<option value="'+i+'" '+(i===s.day?'selected':'')+'>'+d+'</option>').join('')+'</select></div><div class="field"><label for="esS">Start</label><input id="esS" type="time" value="'+tm(s.start)+'"></div><div class="field"><label for="esE">End</label><input id="esE" type="time" value="'+tm(s.end)+'"></div><div class="field full"><label for="esF">Focus</label><input id="esF" maxlength="60" value="'+esc(s.focus)+'"></div></div><p class="err" id="esErr" role="alert"></p><div class="row end"><button class="btn ghost" id="esNo">Cancel</button><button class="btn" id="esYes">Save</button></div></div>';
  m.hidden=false; $('#esS').focus();
  const close=()=>{ m.hidden=true; m.innerHTML=''; };
  $('#esNo').onclick=close; m.onclick=e=>{ if(e.target===m) close(); };
  $('#esYes').onclick=()=>{
    const day=+$('#esD').value, a=$('#esS').value, b=$('#esE').value, f=$('#esF').value.trim(), err=t=>{ $('#esErr').textContent=t; };
    if(!isTime(a)||!isTime(b)) return err('Enter a start and end time.');
    const st0=toMin(a), en=toMin(b);
    if(en-st0<10) return err('A session must be at least 10 minutes long.');
    if(en-st0>180) return err('A session can be at most 3 hours long.');
    if(!f) return err('Enter what you will focus on.');
    if(!freeIntervalsForDay(state.setup,day).some(x=>st0>=x.start&&en<=x.end)) return err('That time is outside your free study time on '+DAYS_LONG[day]+' (school, tuition, sleep, wind-down or your blocked times).');
    const clash=state.plan.sessions.find(o=>o.id!==s.id&&o.kind==='session'&&o.day===day&&st0<o.end&&en>o.start);
    if(clash) return err('That overlaps '+subjName(clash.subjectId)+' at '+fmtTime(clash.start)+' – '+fmtTime(clash.end)+'.');
    state.plan.sessions=state.plan.sessions.filter(o=>!(o.kind==='break'&&((o.day===day&&o.start<en&&o.end>st0)||(o.day===s.day&&(o.end===s.start||o.start===s.end)))));
    Object.assign(s,{day:day,start:st0,end:en,focus:f}); state.plan.sessions.sort((x,y)=>x.day-y.day||x.start-y.start);
    if(s.done){ const l=state.log.find(x=>x.sid===s.id); if(l) l.minutes=en-st0; }
    ui.day=day; save(); close(); renderView(); toast('Session updated.');
  };
}

    if(it.t==='brk') return '<div class="slot brk"><div class="tm">'+fmtTime(it.start)+'</div><div>Break · '+(it.end-it.start)+' min. Stretch, drink water, step away from the screen.</div><span></span></div>';
    return '<div class="slot block"><div class="tm">'+fmtTime(it.start)+'<br>'+fmtTime(it.end)+'</div><div class="bx">'+esc(it.label)+'</div><span></span></div>';

  +(wv?'':'<div class="days" role="tablist" aria-label="Days of the week">'+tabs+'</div>')
  +(wv?weekHTML:'<h3 style="margin-bottom:8px">'+DAYS_LONG[d]+(d===today?' (today)':'')+'</h3>'+empty+'<div>'+rowsHTML+'</div>')+'</section>'
  +'<section class="grid cols-2"><div class="card"><h2>Time by subject this week</h2>'+(Object.keys(mins).length?Object.keys(mins).sort((a,b)=>mins[b]-mins[a]).map(k=>'<div style="margin-bottom:10px"><div class="row between small"><span>'+dot(subjColor(k))+' '+esc(subjName(k))+'</span><span class="muted">'+(mins[k]/60).toFixed(1)+' h</span></div>'+bar(mins[k]/maxMin*100,subjColor(k))+'</div>').join(''):'<div class="empty"><b>No sessions planned</b>Check your times in Setup.</div>')+'<p class="small muted">Subjects with bigger gaps, difficult ratings and unfinished tricky chapters get more time. The last session of the week is a review.</p></div>'

function hubListHTML(){

  let count=0; let html='';
  subs.forEach(s=>{
    const m=meta(s.id); let part=''; let lastGroup='';
    chaptersOf(s.id).forEach(c=>{
      if(q && !(c.name.toLowerCase().includes(q)||c.group.toLowerCase().includes(q)||m.name.toLowerCase().includes(q))) return;
      const _c=chState(state,s.id,c.name), _st=_c.done?'done':_c.started?'progress':'notstarted', _k=chKey(s.id,c.name)+'|';
      if(ui.hubStatus!=='all'&&ui.hubStatus!==_st) return;
      if(ui.hubBook&&!Object.keys(state.bookmarks||{}).some(k=>k.indexOf(_k)===0&&state.bookmarks[k])) return;
      count++;
      if(c.group!==lastGroup){ part+='<h4 class="small muted" style="margin:14px 0 6px">'+esc(c.group)+'</h4>'; lastGroup=c.group; }
      const key=chKey(s.id,c.name), cs=chState(state,s.id,c.name), open=ui.open.has(key);
      part+='<div class="chap" style="--c:'+m.color+'"><button class="chap-h" data-act="hubOpen" data-key="'+esc(key)+'" aria-expanded="'+open+'">'+dot(m.color)+'<span class="tt"><b>'+esc(c.name)+'</b><span class="tiny faint">'+esc(m.name)+'</span></span><span class="badges">'+(cs.hard?'<span class="pill bad">Tricky</span>':'')+(cs.done?'<span class="pill good">Completed</span>':cs.started?'<span class="pill warn">In progress</span>':'<span class="pill plain">Not started</span>')+(Object.keys(state.bookmarks||{}).some(k=>k.indexOf(key+'|')===0&&state.bookmarks[k])?'<span class="pill plain">★</span>':'')+(cs.revised?'<span class="pill good">Revised</span>':'')+'</span>'+icon('chev')+'</button>'
        +(open?chapterBody(s.id,c.name,cs):'')+'</div>';
    });

function dueLabel(t){
  if(!t.due) return {text:'No deadline',cls:'plain'};
  const d=daysBetween(now(),parseKey(t.due));
  if(t.done) return {text:'Due '+fmtDate(t.due),cls:'plain'};
  if(d<0) return {text:'Was due '+fmtDate(t.due),cls:'warn'};
  if(d===0) return {text:'Due today',cls:'warn'};
  if(d===1) return {text:'Due tomorrow',cls:''};
  if(d<=6) return {text:'Due in '+d+' days',cls:''};
  return {text:'Due '+fmtDate(t.due),cls:'plain'};
}

function importData(file){
  const fr=new FileReader();
  fr.onload=()=>{ try{ const s=JSON.parse(fr.result); if(!s||!s.setup||!Array.isArray(s.subjects)) throw new Error('bad'); state=fillDefaults(s); state.plan=null; ui.draft=null; save(); renderView(); toast('Backup imported.'); }
    catch(e){ toast('That file is not a valid backup.'); } };
  fr.readAsText(file);
}

/* ---- event wiring (one place for every button) ---- */
const actions = {
  go:el=>{ if(el.dataset.to==='setup'){ ui.draft=null; } go(el.dataset.to); },
  toggleSession:el=>toggleSession(el.dataset.id),
  regen:()=>regen(),
  openLesson:el=>openLesson(el.dataset.sid,el.dataset.name),
  subToggle:el=>{ const x=state.subjects.find(o=>o.id===el.dataset.id); if(!x) return; if(x.enabled&&state.subjects.filter(o=>o.enabled).length<=1){ toast('Keep at least one subject turned on.'); return; } x.enabled=!x.enabled; state.plan=generatePlan(state,now(),{keepDone:true,strict:true}); save(); renderView(); },
  planView:el=>{ ui.planView=el.dataset.id; renderView(); },
  planFilter:el=>{ ui.planFilter=el.dataset.id; renderView(); },
  editSess:el=>editSession(el.dataset.id),
  delSess:async el=>{ const x=state.plan.sessions.find(o=>o.id===el.dataset.id); if(!x) return; if(await ask('Delete this session?',subjName(x.subjectId)+' '+fmtTime(x.start)+' – '+fmtTime(x.end)+' will be removed from your plan. Regenerate the plan to get it back.','Delete')){ state.plan.sessions=state.plan.sessions.filter(o=>o.id!==x.id&&!(o.kind==='break'&&o.day===x.day&&(o.end===x.start||o.start===x.end))); state.log=state.log.filter(l=>l.sid!==x.id); save(); renderView(); } },
  dayTab:el=>{ ui.day=Number(el.dataset.day); renderView(); },
  hubSubject:el=>{ ui.hubSubject=el.dataset.id; renderView(); },
  hubStatus:el=>{ ui.hubStatus=el.dataset.id; renderView(); },
  hubBook:()=>{ ui.hubBook=!ui.hubBook; renderView(); },
  bm:el=>{ const k=el.dataset.key; state.bookmarks=state.bookmarks||{}; if(state.bookmarks[k]) delete state.bookmarks[k]; else state.bookmarks[k]=true; save(); el.setAttribute('aria-pressed',!!state.bookmarks[k]); if(ui.hubBook) $('#hubList').innerHTML=hubListHTML(); },
  chStatus:el=>{ const parts=el.dataset.key.split('|'), sid=parts[0], name=parts.slice(1).join('|'), v=el.dataset.status; setChapter(sid,name,'started',v==='progress'); setChapter(sid,name,'done',v==='done'); $('#hubList').innerHTML=hubListHTML(); },
  chCheck:el=>{ const parts=el.dataset.key.split('|'), sid=parts[0], name=parts.slice(1).join('|'); const a=(chState(state,sid,name).check||[]).slice(); a[+el.dataset.i]=el.checked; setChapter(sid,name,'check',a); },
  hubOpen:el=>{ const k=el.dataset.key; if(ui.open.has(k)) ui.open.delete(k); else ui.open.add(k); $('#hubList').innerHTML=hubListHTML(); },
  chToggle:el=>{ const parts=el.dataset.key.split('|'); const sid=parts[0], name=parts.slice(1).join('|'); const cur=!!chState(state,sid,name)[el.dataset.field]; setChapter(sid,name,el.dataset.field,!cur); $('#hubList').innerHTML=hubListHTML(); },
  actTask:el=>{ const label={summary:'Summary sheet',questions:'Practice questions',mistakes:'Mistake log'}[el.dataset.kind]; state.tasks.push({ id:'k-'+uid(), title:label+': '+el.dataset.name, subjectId:el.dataset.sid, due:'', done:false }); save(); toast('Added to your tasks.','View tasks',()=>go('tasks')); },
  editTask:el=>{ ui.taskEdit=el.dataset.id; ui.taskDraft=null; ui.taskErrors={}; renderView(); window.scrollTo({top:0,behavior:'smooth'}); },
  cancelEdit:()=>{ ui.taskEdit=null; ui.taskDraft=null; ui.taskErrors={}; renderView(); },
  resetTasks:async()=>{ if(await ask('Reset tasks to demo data?','Your current tasks will be replaced by the sample tasks. Marks and plan are not touched.','Reset')){ state.tasks=makeSampleState(now()).tasks; ui.taskEdit=null; save(); renderView(); toast('Demo tasks restored.'); } },
  taskFilter:el=>{ ui.taskFilter=el.dataset.id; renderView(); },
  toggleTask:el=>{ const t=state.tasks.find(x=>x.id===el.dataset.id); if(!t) return; t.done=!t.done; if(t.done) t.doneOn=dateKey(now()); else delete t.doneOn; save(); renderView(); if(t.done) toast('Task done. Nice work.'); },
  delTask:async el=>{ const t=state.tasks.find(x=>x.id===el.dataset.id); if(!t) return; if(await ask('Delete this task?','\u201c'+t.title+'\u201d will be removed.','Delete')){ state.tasks=state.tasks.filter(x=>x.id!==t.id); save(); renderView(); } },
  editTest:el=>{ const t=state.tests.find(x=>x.id===el.dataset.id); if(!t) return; ui.testEdit=t.id; ui.testDraft={subject:t.subjectId,label:t.label,marks:t.marks,max:t.max,date:t.date,target:t.target}; ui.testErrors={}; renderView(); window.scrollTo({top:document.querySelector('[data-form=addTest]').offsetTop-80,behavior:'smooth'}); },
  delTest:async el=>{ if(await ask('Delete this test result?','Your trend charts will update. Your current marks in Setup stay as they are.','Delete')){ state.tests=state.tests.filter(x=>x.id!==el.dataset.id); save(); renderView(); } },
  period:el=>{ ui.period=el.dataset.id; renderView(); },
  chartSel:el=>{ ui.chart=el.dataset.id; renderView(); },
  addOther:()=>{ ui.draft.others.push({id:uid(),label:'',day:'-1',start:'',end:''}); renderView(); },
  delOther:el=>{ ui.draft.others.splice(Number(el.dataset.i),1); renderView(); },
  clearSample:()=>{ const d=ui.draft; d.name=''; d.examDate=''; SUBJECTS_META.forEach(m=>{ d.subjects[m.id].current=''; d.subjects[m.id].target=''; }); d.hard={}; d.startFresh=true; ui.errors={}; renderView(); toast('Sample values cleared. Enter your own.'); },
  setupBack:()=>{ if(ui.step>0){ ui.step--; ui.errors={}; renderView(); window.scrollTo(0,0); } },
  setupNext:()=>{ const e=validateDraft(ui.draft,[ui.step]); ui.errors=e; if(Object.keys(e).length){ renderView(); window.scrollTo(0,0); return; } ui.step++; renderView(); window.scrollTo(0,0); },
  setupFinish:()=>{ const e=validateDraft(ui.draft,[0,1,2]); ui.errors=e; const ks=Object.keys(e);
    if(ks.length){ ui.step=Math.min.apply(null,ks.map(stepOfKey)); renderView(); window.scrollTo(0,0); toast('Please fix the highlighted fields.'); return; }
    commitSetup(); location.hash='#dashboard'; renderView(); toast('Saved. Your plan is ready.'); },
  exportData:()=>exportData(),
  loadSample:async()=>{ if(await ask('Load sample data?','This replaces what you have now with the made-up sample student.','Load sample')){ state=makeSampleState(now()); ui.draft=null; save(); go('dashboard'); toast('Sample data loaded.'); } },
  wipe:()=>wipeAll()
};
document.addEventListener('click', e=>{ const el=e.target.closest('[data-act]'); if(!el) return; const fn=actions[el.dataset.act]; if(fn){ if(el.tagName==='A') e.preventDefault(); fn(el,e); } });
document.addEventListener('change', e=>{ const k=e.target.dataset&&e.target.dataset.tf; if(!k) return; ui[k]=e.target.value; renderView(); });
document.addEventListener('submit', e=>{ const f=e.target.closest('form[data-form]'); if(!f) return; e.preventDefault(); submitForm(f); });
function bindChange(e){
  const t=e.target;
  if(t.id==='hubSearch'){ if(ui.hubQuery===t.value) return; ui.hubQuery=t.value; $('#hubList').innerHTML=hubListHTML(); return; }
  if(!ui.draft || route()!=='setup') return;
  if(t.dataset.bind!==undefined){
    setPath(ui.draft,t.dataset.bind,t.type==='checkbox'?t.checked:t.value);
    if(ui.errors[t.dataset.bind]){ delete ui.errors[t.dataset.bind]; const f=t.closest('.field'); if(f){ f.classList.remove('bad'); const er=f.querySelector('.err'); if(er) er.remove(); } }
    if(ui.step===2 && $('#weekPreview')) $('#weekPreview').innerHTML=weekPreviewHTML();
  } else if(t.dataset.toggle){
    const arr=ui.draft[t.dataset.toggle], v=Number(t.dataset.val), i=arr.indexOf(v);
    if(t.checked && i<0) arr.push(v); else if(!t.checked && i>=0) arr.splice(i,1);
    if($('#weekPreview')) $('#weekPreview').innerHTML=weekPreviewHTML();
  } else if(t.dataset.hard){
    if(t.checked) ui.draft.hard[t.dataset.hard]=true; else delete ui.draft.hard[t.dataset.hard];
    const sm=t.closest('details').querySelector('summary .small'); if(sm){ const pre=t.dataset.hard.split('|')[0]; sm.textContent=Object.keys(ui.draft.hard).filter(k=>k.startsWith(pre+'|')).length+' selected'; }
  }
}
function setPath(o,path,v){ const ks=path.split('.'); let c=o; for(let i=0;i<ks.length-1;i++) c=c[ks[i]]; c[ks[ks.length-1]]=v; }
document.addEventListener('change', e=>{ bindChange(e); if(e.target.id==='importFile' && e.target.files[0]) importData(e.target.files[0]); });
document.addEventListener('input', e=>{ if(e.target.id==='hubSearch' || (e.target.dataset && e.target.dataset.bind!==undefined && e.target.type!=='checkbox' && e.target.tagName!=='SELECT')) bindChange(e); });
window.addEventListener('hashchange', ()=>{ if(route()!=='setup') ui.draft=null; renderView(); window.scrollTo(0,0); });
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) renderView(); });

/* ---- start ---- */
(function init(){
  state=load();
  if(!state){ state=makeSampleState(now()); }
  renderShell(); ensurePlan(); save(); renderView();
})();
</script>
</body>
